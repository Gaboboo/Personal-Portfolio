<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="500" height="560">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1e24"/>
      <stop offset="50%" stop-color="#2a2932"/>
      <stop offset="100%" stop-color="#141318"/>
    </linearGradient>

    <!-- Subtle Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#c0c0c0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c0c0c0" stop-opacity="0"/>
    </radialGradient>

    <!-- Torso Gradient -->
    <linearGradient id="torsoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f2e36"/>
      <stop offset="100%" stop-color="#121215"/>
    </linearGradient>

    <!-- Head & Skin Tone -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44434d"/>
      <stop offset="100%" stop-color="#27262d"/>
    </linearGradient>

    <!-- Accent Silver -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#9999a4"/>
    </linearGradient>

    <!-- Clip Path for Rounded Canvas -->
    <clipPath id="cardClip">
      <rect width="500" height="560" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Canvas -->
    <rect width="500" height="560" fill="url(#bgGrad)"/>
    <rect width="500" height="560" fill="url(#glowGrad)"/>

    <!-- Geometric Grid Matrix Background Lines -->
    <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
      <line x1="50" y1="0" x2="50" y2="560"/>
      <line x1="125" y1="0" x2="125" y2="560"/>
      <line x1="200" y1="0" x2="200" y2="560"/>
      <line x1="275" y1="0" x2="275" y2="560"/>
      <line x1="350" y1="0" x2="350" y2="560"/>
      <line x1="425" y1="0" x2="425" y2="560"/>
      <line x1="0" y1="80" x2="500" y2="80"/>
      <line x1="0" y1="160" x2="500" y2="160"/>
      <line x1="0" y1="240" x2="500" y2="240"/>
      <line x1="0" y1="320" x2="500" y2="320"/>
      <line x1="0" y1="400" x2="500" y2="400"/>
      <line x1="0" y1="480" x2="500" y2="480"/>
    </g>

    <!-- Code Accents / Minimalist UI Watermarks -->
    <g opacity="0.25" font-family="monospace" font-size="13" fill="#c0c0c0">
      <text x="35" y="60">&lt;mmv:architect status="active" /&gt;</text>
      <text x="350" y="60">uptime: 99.99%</text>
      <text x="35" y="525">0 dependencies // 100% web standards</text>
    </g>

    <!-- Developer Portrait Silhouette -->
    <!-- Ambient Halo Behind Head -->
    <circle cx="250" cy="210" r="110" fill="#383742" opacity="0.6"/>
    <circle cx="250" cy="210" r="110" fill="none" stroke="url(#silverGrad)" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>

    <!-- Shoulders & Torso -->
    <path d="M120 560 C120 440, 160 380, 250 380 C340 380, 380 440, 380 560 Z" fill="url(#torsoGrad)"/>
    <path d="M120 560 C120 440, 160 380, 250 380 C340 380, 380 440, 380 560 Z" fill="none" stroke="#3e3d48" stroke-width="1.5"/>

    <!-- Jacket / Collar Lapels -->
    <path d="M210 385 L250 480 L290 385" fill="none" stroke="url(#silverGrad)" stroke-width="2.5" opacity="0.7"/>
    <path d="M250 480 L250 560" stroke="#383742" stroke-width="2"/>

    <!-- Neck -->
    <rect x="226" y="295" width="48" height="95" rx="8" fill="#32313b"/>

    <!-- Head -->
    <ellipse cx="250" cy="215" rx="72" ry="92" fill="url(#headGrad)"/>

    <!-- Minimalist Glasses / Tech Specs -->
    <g stroke="url(#silverGrad)" stroke-width="3" fill="none" opacity="0.85">
      <!-- Left Rim -->
      <rect x="195" y="195" width="46" height="34" rx="8" fill="#1b1a20" fill-opacity="0.6"/>
      <!-- Right Rim -->
      <rect x="259" y="195" width="46" height="34" rx="8" fill="#1b1a20" fill-opacity="0.6"/>
      <!-- Bridge -->
      <line x1="241" y1="210" x2="259" y2="210"/>
      <!-- Temples -->
      <line x1="195" y1="208" x2="178" y2="204"/>
      <line x1="305" y1="208" x2="322" y2="204"/>
    </g>

    <!-- Modern Hair Cut Silhouette -->
    <path d="M174 210 C172 135, 205 110, 250 110 C295 110, 328 135, 326 210 C322 170, 310 135, 250 135 C190 135, 178 170, 174 210 Z" fill="#151419"/>

    <!-- Floating HUD Elements on Avatar -->
    <g transform="translate(60, 240)">
      <rect width="64" height="28" rx="6" fill="#1c1b22" stroke="#363540" stroke-width="1"/>
      <text x="32" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">ONLINE</text>
    </g>

    <g transform="translate(376, 240)">
      <rect width="64" height="28" rx="6" fill="#1c1b22" stroke="#363540" stroke-width="1"/>
      <text x="32" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">&lt;DEV/&gt;</text>
    </g>

    <!-- Outer Card Border -->
    <rect width="500" height="560" rx="24" fill="none" stroke="#3e3d48" stroke-width="2"/>
  </g>
</svg>
